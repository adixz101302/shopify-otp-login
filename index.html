<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simplify Login - OTP & Biometric Authentication</title>
    <!-- Use a modern, beautiful font like Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include Remix Icons for sleek, consistent SVGs -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script type="module" src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Floating decorative shapes in background -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        
        <main class="login-card">
            <div class="brand-header">
                <div class="logo">
                    <i class="ri-shield-keyhole-fill"></i>
                </div>
                <h1>Welcome Back</h1>
                <p id="step-description">Sign in using your mobile number or email</p>
            </div>

            <!-- STEP 1: Phone / Email Input -->
            <div class="form-step active" id="step-input">
                <form id="contact-form">
                    <div class="input-group">
                        <label for="contact-input">Phone or Email</label>
                        <div class="input-wrapper">
                            <i class="ri-user-line input-icon"></i>
                            <input 
                                type="text" 
                                id="contact-input" 
                                placeholder="e.g. +1 234 567 8900 or email@domain.com"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="btn-send-otp">
                        <span class="btn-text">Continue with OTP</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>

                <div class="divider">
                    <span>Or continue with</span>
                </div>

                <div class="social-login-grid">
                    <button class="btn-social" onclick="simulateLogin('Google')">
                        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
                    </button>
                    <button class="btn-social" onclick="simulateLogin('Apple')">
                        <i class="ri-apple-fill" style="font-size: 24px;"></i>
                    </button>
                </div>

                <button class="btn-biometrics" onclick="simulateLogin('Biometrics')">
                    <i class="ri-fingerprint-line"></i>
                    Use Touch ID or Face ID
                </button>
            </div>

            <!-- STEP 2: OTP Entry (Hidden initially) -->
            <div class="form-step" id="step-otp">
                <button type="button" class="btn-back" id="btn-back">
                    <i class="ri-arrow-left-line"></i>
                    Back
                </button>
                
                <form id="otp-form">
                    <div class="otp-container">
                        <input type="text" class="otp-input" maxlength="1" pattern="\d" required>
                        <input type="text" class="otp-input" maxlength="1" pattern="\d" required>
                        <input type="text" class="otp-input" maxlength="1" pattern="\d" required>
                        <input type="text" class="otp-input" maxlength="1" pattern="\d" required>
                    </div>
                    
                    <button type="submit" class="btn-primary mt-4" id="btn-verify-otp">
                        <span class="btn-text">Verify & Login</span>
                        <div class="loader hidden"></div>
                    </button>
                </form>

                <div class="resend-container">
                    <p>Didn't receive the code? <button type="button" class="btn-text-only" id="btn-resend">Resend (00:30)</button></p>
                </div>
            </div>

            <!-- Success State -->
            <div class="form-step success-state" id="step-success">
                <div class="success-icon">
                    <i class="ri-check-line"></i>
                </div>
                <h2>Login Successful!</h2>
                <p>Welcome to our store. Redirecting...</p>
            </div>
            
        </main>
    </div>

    <!-- Firebase Recaptcha Container -->
    <div id="recaptcha-container"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
